phpclaw.settings:
  type: config_object
  label: 'PhpClaw AI Agent settings'
  mapping:
    provider:
      type: string
      label: 'AI provider (anthropic, openai, groq, gemini, mistral, deepseek, ollama, custom)'
    model:
      type: string
      label: 'Model override'
    api_key:
      type: string
      label: 'API key for the selected provider'
    base_url:
      type: string
      label: 'OpenAI-compatible base URL (used when provider = custom)'
    max_iterations:
      type: integer
      label: 'Max agent loop iterations'
    store_messages:
      type: boolean
      label: 'Store conversation message text'
    api_auth_providers:
      type: sequence
      label: 'Authentication provider ids accepted on the phpClaw REST routes'
      sequence:
        type: string
        label: 'Authentication provider id'
    system_prompt:
      type: string
      label: 'Custom system prompt for the AI agent'
    cloud_key:
      type: string
      label: 'phpClaw Cloud API key'
    cloud_signing_secret:
      type: string
      label: 'phpClaw Cloud scan-response signing secret'
    cloud_disable:
      type: sequence
      label: 'Disabled cloud features'
      sequence:
        type: string
    shell_allowlist:
      type: sequence
      label: 'Shell tool allowed commands'
      sequence:
        type: string
        label: 'Command'
    remote_skill_urls:
      type: string
      label: 'Comma-separated HTTPS URLs for remote skill files'
    guards:
      type: sequence
      label: 'Guard entries'
      sequence:
        type: ignore
        label: 'Guard (class, priority)'
    hooks:
      type: sequence
      label: 'Hook entries'
      sequence:
        type: ignore
        label: 'Hook (event, handler)'
    skills:
      type: sequence
      label: 'Skill entries'
      sequence:
        type: ignore
        label: 'Skill (name/description/tags/content, or file, or class)'
    tool_deny:
      type: sequence
      label: 'Tool names or group references to exclude from the registry'
      sequence:
        type: string
        label: 'Tool name or group reference'
