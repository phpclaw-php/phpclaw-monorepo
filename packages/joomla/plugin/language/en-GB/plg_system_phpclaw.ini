; phpClaw System Plugin - English (GB)

PLG_SYSTEM_PHPCLAW="phpClaw AI Agent"
PLG_SYSTEM_PHPCLAW_DESC="Universal AI agent engine for Joomla 4/5/6. Connect any AI provider and run agents from the CLI or admin panel."

; Fieldset labels
PLG_SYSTEM_PHPCLAW_FIELDSET_PROVIDER="Provider"
PLG_SYSTEM_PHPCLAW_FIELDSET_STORAGE="Memory & Storage"
PLG_SYSTEM_PHPCLAW_FIELDSET_AGENT="Agent Behaviour"
PLG_SYSTEM_PHPCLAW_FIELDSET_SKILLS="Skills"
PLG_SYSTEM_PHPCLAW_FIELDSET_CLOUD="Cloud"
PLG_SYSTEM_PHPCLAW_FIELDSET_LIMITS="Fallback & Limits"

; Skills
PLG_SYSTEM_PHPCLAW_FIELD_REMOTE_SKILL_URLS_LABEL="Remote Skill URLs"
PLG_SYSTEM_PHPCLAW_FIELD_REMOTE_SKILL_URLS_DESC="One HTTPS URL per line. Each points to a phpClaw JSON skill collection or a SKILL.md file. Remote skills are inert text injected into prompts, never executed. Fetched with SSRF protection and cached for 24 hours."

; Provider
PLG_SYSTEM_PHPCLAW_FIELD_PROVIDER_LABEL="Provider"
PLG_SYSTEM_PHPCLAW_FIELD_PROVIDER_DESC="The AI provider the agent talks to. Ollama runs locally and needs no key; Custom points at any OpenAI-compatible endpoint."
PLG_SYSTEM_PHPCLAW_PROVIDER_SELECT="Select a provider"

; Model
PLG_SYSTEM_PHPCLAW_FIELD_MODEL_LABEL="Model"
PLG_SYSTEM_PHPCLAW_FIELD_MODEL_DESC="Optional. Leave blank to use the provider's default model."
PLG_SYSTEM_PHPCLAW_FIELD_MODEL_HINT="e.g. claude-haiku-4-5-20251001, gpt-4o, llama3.1:8b"

; API Key (single field - shown for all providers except Ollama)
PLG_SYSTEM_PHPCLAW_FIELD_API_KEY_LABEL="API Key"
PLG_SYSTEM_PHPCLAW_FIELD_API_KEY_DESC="Your API key for the selected provider. Leave blank for Ollama (local models)."

; Base URL (Custom provider only)
PLG_SYSTEM_PHPCLAW_FIELD_BASE_URL_LABEL="Base URL"
PLG_SYSTEM_PHPCLAW_FIELD_BASE_URL_DESC="For the Custom provider only. The full OpenAI-compatible /chat/completions endpoint URL. Enter your API key above if the endpoint requires one."

; Store Messages
PLG_SYSTEM_PHPCLAW_FIELD_STORE_MESSAGES_LABEL="Store Messages"
PLG_SYSTEM_PHPCLAW_FIELD_STORE_MESSAGES_DESC="When enabled: prompt and response text is saved, so a conversation remembers previous messages. When disabled: no message content is ever saved; each prompt is processed independently."

; System Prompt
PLG_SYSTEM_PHPCLAW_FIELD_SYSTEM_PROMPT_LABEL="System Prompt"
PLG_SYSTEM_PHPCLAW_FIELD_SYSTEM_PROMPT_DESC="Optional. Customise the AI's persona and behaviour for your site."
PLG_SYSTEM_PHPCLAW_FIELD_SYSTEM_PROMPT_HINT="e.g. You are a helpful assistant for my Joomla site. Always be concise."

; Max Iterations
PLG_SYSTEM_PHPCLAW_FIELD_MAX_ITERATIONS_LABEL="Max Iterations"
PLG_SYSTEM_PHPCLAW_FIELD_MAX_ITERATIONS_DESC="Maximum tool-call iterations per request. Default: 20."
PLG_SYSTEM_PHPCLAW_FALLBACK_OFF="Off"
PLG_SYSTEM_PHPCLAW_FIELD_FALLBACK_PROVIDER_LABEL="Fallback Provider"
PLG_SYSTEM_PHPCLAW_FIELD_FALLBACK_PROVIDER_DESC="Optional. Used only when the main provider fails with a connection error, a 429 or a 5xx. Lists only providers with the same tool format as the main provider. Off turns fallback off."
PLG_SYSTEM_PHPCLAW_FIELD_FALLBACK_MODEL_LABEL="Fallback Model"
PLG_SYSTEM_PHPCLAW_FIELD_FALLBACK_MODEL_DESC="Leave blank to use the fallback provider's default model."
PLG_SYSTEM_PHPCLAW_FIELD_FALLBACK_API_KEY_LABEL="Fallback API Key"
PLG_SYSTEM_PHPCLAW_FIELD_FALLBACK_API_KEY_DESC="API key for the fallback provider."
PLG_SYSTEM_PHPCLAW_FIELD_RATE_LIMIT_RPM_LABEL="Rate Limit (requests/min)"
PLG_SYSTEM_PHPCLAW_FIELD_RATE_LIMIT_RPM_DESC="Most calls to the AI provider per minute, shared by every request. 0 turns it off. Maximum 600."
PLG_SYSTEM_PHPCLAW_FIELD_RESPONSE_CACHE_LABEL="Response Cache"
PLG_SYSTEM_PHPCLAW_FIELD_RESPONSE_CACHE_DESC="An identical request within the TTL is answered from the cache instead of calling the provider again."
PLG_SYSTEM_PHPCLAW_FIELD_RESPONSE_CACHE_TTL_LABEL="Response Cache TTL (seconds)"
PLG_SYSTEM_PHPCLAW_FIELD_RESPONSE_CACHE_TTL_DESC="How long a cached answer is kept, in seconds: 60 to 86400. Default 3600."
PLG_SYSTEM_PHPCLAW_FIELD_MAX_TOKEN_BUDGET_LABEL="Max Token Budget"
PLG_SYSTEM_PHPCLAW_FIELD_MAX_TOKEN_BUDGET_DESC="Stops a run before a provider call would take its token spend over this number. 0 turns it off. Maximum 10000000."


; Cloud
PLG_SYSTEM_PHPCLAW_FIELD_CLOUD_KEY_LABEL="Cloud Key"
PLG_SYSTEM_PHPCLAW_FIELD_CLOUD_KEY_DESC="phpClaw Cloud API key. Enables cloud guards and webhook features. Optional."
PLG_SYSTEM_PHPCLAW_FIELD_CLOUD_SIGNING_SECRET_LABEL="Cloud Signing Secret"
PLG_SYSTEM_PHPCLAW_FIELD_CLOUD_SIGNING_SECRET_DESC="Shared secret used to verify signed cloud scan responses. Copy it from your phpClaw Cloud dashboard when you create the API key. Leave empty to skip signature verification."
PLG_SYSTEM_PHPCLAW_FIELD_CLOUD_DISABLE_LABEL="Disable Cloud Features"
PLG_SYSTEM_PHPCLAW_FIELD_CLOUD_DISABLE_DESC="Comma-separated cloud feature names to turn off, or hide_inputs, hide_outputs and hide_metadata to keep that content on your server while tracing stays on. Leave empty to use every feature in your plan. Only applies when a Cloud Key is set above."
PLG_SYSTEM_PHPCLAW_FIELD_CLOUD_DISABLE_HINT="e.g. scan, observability, hide_inputs"
PLG_SYSTEM_PHPCLAW_FIELD_CLOUD_INACTIVE_LABEL="Cloud is inactive"
PLG_SYSTEM_PHPCLAW_FIELD_CLOUD_INACTIVE_DESC="Store Messages is off, so cloud tracing and the cloud security scan are inactive and the cloud fields are hidden. Any cloud settings you already saved are kept. Turn Store Messages on to see them again."
