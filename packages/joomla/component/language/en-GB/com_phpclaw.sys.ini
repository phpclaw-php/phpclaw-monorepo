; phpClaw Component - System strings (installer, menu)
COM_PHPCLAW="phpClaw"
COM_PHPCLAW_DESC="phpClaw AI Agent admin component. Chat with AI and explore features."
COM_PHPCLAW_MENU="phpClaw"
COM_PHPCLAW_MENU_CHAT="Chat"
COM_PHPCLAW_MENU_ANALYTICS="Analytics"
COM_PHPCLAW_MENU_GUIDE="Guide"
COM_PHPCLAW_MENU_ABOUT="About"

; ACL actions (must live here, not com_phpclaw.ini - com_config's component Permissions view only loads the .sys.ini file)
COM_PHPCLAW_ACL_CHAT_USE="Use Chat"
COM_PHPCLAW_ACL_CHAT_USE_DESC="Allow access to every phpClaw admin page (Chat, Analytics, Guide, About), to the chat endpoints, and to every phpClaw tool including raw SQL, user management and extension installation. Super User equivalent in effect, so grant it only to trusted groups. Each user still sees only their own conversations. The group also needs the core.manage action on this component for the phpClaw menu to appear."
COM_PHPCLAW_ACL_CHAT_MANAGEALL="Manage All Conversations"
COM_PHPCLAW_ACL_CHAT_MANAGEALL_DESC="Widen Chat and Analytics from the user's own conversations to every user's, and show the administrator-only endpoints in the Guide."