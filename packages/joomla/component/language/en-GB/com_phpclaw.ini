COM_PHPCLAW_GUIDE_EP_LOAD="Load a conversation's message history."
COM_PHPCLAW_GUIDE_EP_SAVE="Save plugin settings. Accepts any of the eleven plugin fields."
COM_PHPCLAW_GUIDE_EP_SAVE_FIELDS="task=api.saveSettings accepts provider, model, api_key, base_url, store_messages, system_prompt, max_iterations, remote_skill_urls, cloud_key, cloud_signing_secret and cloud_disable. A field you leave out keeps its stored value. The three credentials (api_key, cloud_key, cloud_signing_secret) also keep their stored value when sent empty or masked, so a form round trip cannot erase them; every other field is written exactly as sent, including empty. An unusable value is rejected with HTTP 400 naming the field, and the response lists what was written and which credentials were left alone."
COM_PHPCLAW_GUIDE_EP_TEST="Test provider connection."
COM_PHPCLAW_GUIDE_EP_ENABLE="Enable the phpClaw system plugin."

