; Guide - REST API tab
COM_PHPCLAW_GUIDE_REST_TITLE="REST API"
COM_PHPCLAW_GUIDE_REST_INTRO="Two surfaces reach the agent. Joomla's Web Services API carries the chat routes for machines and headless clients, authenticated with a Joomla API token. The administrator endpoints below carry the admin screens, authenticated with your admin session and a CSRF token."
COM_PHPCLAW_GUIDE_WS_TITLE="Web Services API"
COM_PHPCLAW_GUIDE_WS_INTRO="Two POST routes on Joomla's native Web Services API, served by the api application. No session and no CSRF token: send a Joomla API token as a Bearer header. Both routes require the Use Chat permission, and conversation ownership is enforced exactly as it is in the admin screens."
COM_PHPCLAW_GUIDE_WS_PREREQ="Before the routes answer"
COM_PHPCLAW_GUIDE_WS_PREREQ_1="Enable the Web Services phpClaw plugin, plus the API Authentication Token and User Joomla API Token plugins."
COM_PHPCLAW_GUIDE_WS_PREREQ_2="Joomla grants API Login to Super Users only. To let Manager or Administrator call these routes, grant API Login to those groups in Global Configuration, Permissions."
COM_PHPCLAW_GUIDE_WS_PREREQ_3="The User Joomla API Token plugin also limits which groups may hold a token, Super Users by default. Add any other group that needs one in that plugin's Allowed User Groups setting."
COM_PHPCLAW_GUIDE_WS_AUTH_DESC="Joomla API token, sent as an Authorization: Bearer header. No session cookie and no CSRF token."
COM_PHPCLAW_GUIDE_WS_ACCEPT="Accept"
COM_PHPCLAW_GUIDE_WS_ACCEPT_STREAM_NOTE="The streaming route negotiates text/event-stream. A request that asks for another media type is answered 406 before it reaches phpClaw."
COM_PHPCLAW_GUIDE_ADMIN_TITLE="Administrator endpoints"
COM_PHPCLAW_GUIDE_ADMIN_INTRO="Task-dispatched endpoints used by the phpClaw admin screens. Every call needs an authenticated Joomla admin session plus a valid CSRF token. Settings, plugin enabling and the connection probe live here only, never on the Web Services API."
