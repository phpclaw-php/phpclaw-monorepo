COM_PHPCLAW_WHAT_IS="What is phpClaw?"
COM_PHPCLAW_WHAT_IS_P1="phpClaw is an AI assistant that lives inside your Joomla admin. Connect any AI provider: Anthropic Claude, OpenAI GPT, Groq, Google Gemini, Mistral, DeepSeek, Ollama (local), or any Custom OpenAI-compatible endpoint, and ask questions about your site in plain English."
COM_PHPCLAW_WHAT_IS_P2="No prompts to memorize. No SQL to write. No dashboards to learn. Just ask: "Any pending articles?", "Which extensions are active?", "Show recent errors", and get real answers from real data."
COM_PHPCLAW_WHAT_IS_P3="Part of the phpClaw ecosystem, the same AI engine available for Laravel, WordPress, Drupal, Magento, and other PHP frameworks and CMS platforms."

