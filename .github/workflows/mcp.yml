name: phpclaw-mcp

on:
  push:
    branches: [0.x]
    paths:
      - 'packages/mcp/**'
      - '!packages/mcp/**.md'
      - '.github/workflows/mcp.yml'
      - '.github/workflows/_library-quality.yml'
  pull_request:
    paths:
      - 'packages/mcp/**'
      - '!packages/mcp/**.md'
      - '.github/workflows/mcp.yml'
      - '.github/workflows/_library-quality.yml'


concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/_library-quality.yml
    with:
      library: mcp
      php_versions: '["8.2","8.3","8.4"]'

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    defaults:
      run:
        working-directory: packages/mcp

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress
        continue-on-error: true

      - name: Run unit tests with coverage
        run: vendor/bin/phpunit --testsuite Unit --coverage-text --coverage-clover=coverage.xml

      - name: Run feature tests
        run: vendor/bin/phpunit --testsuite Feature

      - name: Check 80% coverage
        continue-on-error: true
        run: |
          php -r "
            \$xml = simplexml_load_file('coverage.xml');
            \$m = \$xml->project->metrics;
            \$covered = (int)\$m['coveredstatements'];
            \$total   = max(1, (int)\$m['statements']);
            \$pct     = \$covered / \$total * 100;
            echo number_format(\$pct, 1) . '%' . PHP_EOL;
            exit(\$pct < 80 ? 1 : 0);
          "

      - name: Upload coverage
        if: matrix.php == '8.3'
        uses: codecov/codecov-action@v7
        with:
          files: packages/mcp/coverage.xml
          flags: mcp

  prefer-lowest:
    name: Prefer Lowest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    defaults:
      run:
        working-directory: packages/mcp

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: json
          coverage: none

      - name: Install lowest dependencies
        run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage
