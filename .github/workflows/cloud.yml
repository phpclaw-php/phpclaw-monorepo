name: Cloud

on:
  push:
    branches: [0.x]
    paths:
      - 'packages/cloud/**'
      - '!packages/cloud/**.md'
      - '.github/workflows/cloud.yml'
      - '.github/workflows/_library-quality.yml'
  pull_request:
    paths:
      - 'packages/cloud/**'
      - '!packages/cloud/**.md'
      - '.github/workflows/cloud.yml'
      - '.github/workflows/_library-quality.yml'

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/_library-quality.yml
    with:
      library: cloud
      php_versions: '["8.2","8.3","8.4"]'
