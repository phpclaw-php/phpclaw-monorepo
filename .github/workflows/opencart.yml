name: OpenCart

on:
  push:
    branches: [0.x]
    paths:
      - 'packages/opencart/**'
      - '!packages/opencart/**.md'
      - '.github/workflows/opencart.yml'
      - '.github/workflows/_adapter-quality.yml'
  pull_request:
    paths:
      - 'packages/opencart/**'
      - '!packages/opencart/**.md'
      - '.github/workflows/opencart.yml'
      - '.github/workflows/_adapter-quality.yml'


concurrency:
  group: opencart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/_adapter-quality.yml
    with:
      adapter: opencart
      is_cms: true
      php_versions: '["8.1","8.2","8.3","8.4"]'

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, sqlite3
          coverage: xdebug

      - name: Install dependencies
        working-directory: packages/opencart
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=php

      - name: Run tests with coverage
        working-directory: packages/opencart
        run: |
          vendor/bin/phpunit \
            --coverage-text \
            --coverage-clover=coverage.xml

      - name: Check coverage threshold
        working-directory: packages/opencart
        continue-on-error: true
        run: |
          php -r "
            \$xml = simplexml_load_file('coverage.xml');
            \$metrics = \$xml->project->metrics;
            \$covered = (int)\$metrics['coveredstatements'];
            \$total   = (int)\$metrics['statements'];
            if (\$total === 0) { echo 'No statements found'; exit(0); }
            \$pct = (\$covered / \$total) * 100;
            echo number_format(\$pct, 1) . '% coverage' . PHP_EOL;
            if (\$pct < 80) { echo 'Coverage below 80%'; exit(1); }
          "
