name: Core

on:
  push:
    branches: [0.x]
    paths:
      - 'packages/core/**'
      - '!packages/core/**.md'
      - '.github/workflows/core.yml'
      - '.github/workflows/_library-quality.yml'
  pull_request:
    paths:
      - 'packages/core/**'
      - '!packages/core/**.md'
      - '.github/workflows/core.yml'
      - '.github/workflows/_library-quality.yml'

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/_library-quality.yml
    with:
      library: core
      php_versions: '["8.2","8.3","8.4"]'

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - name: Install dependencies
        working-directory: packages/core
        run: composer install --prefer-dist --no-progress --no-interaction


      - name: Run PHPStan
        working-directory: packages/core
        run: vendor/bin/phpstan analyse --no-progress
        continue-on-error: true

      - name: Run unit tests
        working-directory: packages/core
        run: vendor/bin/phpunit --testsuite=Unit --testdox

      - name: Run feature tests (optional — requires API key)
        working-directory: packages/core
        run: vendor/bin/phpunit --testsuite=Feature --testdox
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
        continue-on-error: true

  coverage:
    name: Coverage (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.3 with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, xdebug
          coverage: xdebug

      - name: Install dependencies
        working-directory: packages/core
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests with coverage
        working-directory: packages/core
        run: |
          vendor/bin/phpunit --testsuite=Unit \
            --coverage-text \
            --coverage-clover=coverage.xml

      - name: Check coverage threshold (80%)
        working-directory: packages/core
        run: |
          php -r "
            \$xml = simplexml_load_file('coverage.xml');
            \$metrics = \$xml->project->metrics;
            \$covered = (int)\$metrics['coveredstatements'];
            \$total   = (int)\$metrics['statements'];
            if (\$total === 0) { echo 'No statements found'; exit(0); }
            \$pct = (\$covered / \$total) * 100;
            echo number_format(\$pct, 1) . '% coverage' . PHP_EOL;
            if (\$pct < 80) { echo 'Coverage below 80%'; exit(1); }
          "

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: packages/core/coverage.xml
          flags: core
          fail_ci_if_error: false
        continue-on-error: true

  prefer-lowest:
    name: Prefer Lowest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, json
          coverage: none

      - name: Install lowest dependencies
        working-directory: packages/core
        run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress

      - name: Run unit tests
        working-directory: packages/core
        run: vendor/bin/phpunit --testsuite=Unit --no-coverage
