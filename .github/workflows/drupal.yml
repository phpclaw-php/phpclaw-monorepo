name: drupal

on:
  push:
    branches: [0.x]
    paths:
      - 'packages/drupal/**'
      - '!packages/drupal/**.md'
      - '.github/workflows/drupal.yml'
      - '.github/workflows/_adapter-quality.yml'
  pull_request:
    paths:
      - 'packages/drupal/**'
      - '!packages/drupal/**.md'
      - '.github/workflows/drupal.yml'
      - '.github/workflows/_adapter-quality.yml'


concurrency:
  group: drupal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/_adapter-quality.yml
    with:
      adapter: drupal
      is_cms: true
      php_versions: '["8.1","8.2","8.3","8.4"]'

  test:
    name: PHP ${{ matrix.php }} / Drupal ${{ matrix.drupal }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # Drupal core's own composer.json requires sebastian/diff ^4 (a real,
          # production dependency — used in Drupal's config-diff UI), while our
          # default phpunit ^10.5 requires sebastian/diff ^5. Drupal 11.2+ broadened
          # its own constraint to allow ^5 too, but Drupal 10 never did — so testing
          # Drupal 10 needs PHPUnit 9.6 (whose own sebastian/diff ^4.0.6 requirement
          # matches), with doctrine/instantiator pinned to ~2.0.0 (phpunit 9.6 allows
          # ^1.5||^2, and ^2.1+ requires PHP 8.4's typed class constants — breaks 8.1-8.3).
          - php: '8.1'
            drupal: '^10.6'
            legacy_phpunit: true
          - php: '8.2'
            drupal: '^10.6'
            legacy_phpunit: true
          - php: '8.3'
            drupal: '^10.6'
            legacy_phpunit: true
          - php: '8.4'
            drupal: '^10.6'
            legacy_phpunit: true
          # Drupal 11 itself requires php >=8.3 (its own composer.json constraint) —
          # PHP 8.1/8.2 are not valid combinations here, unlike Drupal 10.
          - php: '8.3'
            drupal: '^11.3'
            legacy_phpunit: false
          - php: '8.4'
            drupal: '^11.3'
            legacy_phpunit: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, curl, json, mbstring
          coverage: pcov

      - name: Swap to PHPUnit 9.6 for Drupal 10 compat
        if: matrix.legacy_phpunit
        working-directory: packages/drupal
        run: composer require --dev "phpunit/phpunit:^9.6" "doctrine/instantiator:~2.0.0" --no-update --no-interaction

      - name: Require Drupal version
        working-directory: packages/drupal
        run: composer require "drupal/core:${{ matrix.drupal }}" --no-update --no-interaction

      - name: Install dependencies
        working-directory: packages/drupal
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=php

      - name: Run unit tests
        working-directory: packages/drupal
        run: ./vendor/bin/phpunit --testsuite Unit --testdox

      - name: Run unit tests with coverage
        if: matrix.php == '8.4' && matrix.drupal == '^11.3'
        working-directory: packages/drupal
        run: ./vendor/bin/phpunit --testsuite Unit --coverage-text
